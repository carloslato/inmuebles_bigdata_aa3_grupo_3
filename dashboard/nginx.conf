server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Dashboard static files
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Pipeline output data (shared volume)
    location /data/ {
        alias /pipeline_output/;
        autoindex on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        
        # JSON files
        types {
            application/json json;
        }
    }
    
    # Pipeline status en tiempo real (archivo JSON que se actualiza durante la ejecución)
    location /api/status_realtime {
        alias /pipeline_output/pipeline_status.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
    }

    # Proxy API requests to the backend Python service
    # Las rutas en Flask son /api/<collection>, asi que proxy_pass debe mantener el path completo
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}